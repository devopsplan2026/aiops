
name: Boutique CI Pipeline

# Run pipeline manually
on:
  workflow_dispatch:

# Common variables
env:
  AWS_REGION: ${{ secrets.AWS_REGION }}
  IMAGE_TAG: ${{ github.sha }}

jobs:

  # JOB 1: Build and Push Docker Images
  build-and-push:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        service:
          - auth
          - gateway
          - orders
          - order-service
          - product-service
          - user-service
          - frontend

    steps:
      # Step 1: Download GitHub code
      - name: Checkout Code
        uses: actions/checkout@v4

      # Step 2: Connect to AWS
      - name: Configure AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      # Step 3: Login to AWS ECR
      - name: Login to ECR
        run: |
          aws ecr get-login-password --region $AWS_REGION | docker login \
            --username AWS \
            --password-stdin ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.$AWS_REGION.amazonaws.com

      # Step 4: Build Docker Image
      - name: Build Docker Image
        run: |
          if [ "${{ matrix.service }}" = "frontend" ]; then
            PATH_TO_BUILD="./boutique-microservices/frontend"
          else
            PATH_TO_BUILD="./boutique-microservices/backend/services/${{ matrix.service }}"
          fi

          docker build -t ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.$AWS_REGION.amazonaws.com/${{ matrix.service }}:$IMAGE_TAG $PATH_TO_BUILD

      # Step 5: Push Docker Image to ECR
      - name: Push Docker Image
        run: |
          docker push ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.$AWS_REGION.amazonaws.com/${{ matrix.service }}:$IMAGE_TAG


  # JOB 2: Update Kubernetes YAML Files
  update-manifests:
    runs-on: ubuntu-latest
    needs: build-and-push

    permissions:
      contents: write

    steps:

      # Step 1: Download GitHub code
      - name: Checkout Code
        uses: actions/checkout@v4

      # Step 2: Update backend image tags
      - name: Update Backend Images
        run: |
          for SERVICE in auth gateway orders order-service product-service user-service
          do
            sed -i "s|image:.*|image: ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.${{ env.AWS_REGION }}.amazonaws.com/$SERVICE:${{ github.sha }}|" gitops/k8s/backend/$SERVICE.yml
          done

      # Step 3: Update frontend image tag
      - name: Update Frontend Image
        run: |
          sed -i "s|image:.*|image: ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.${{ env.AWS_REGION }}.amazonaws.com/frontend:${{ github.sha }}|" gitops/k8s/frontend/deployment.yml

      # Step 4: Commit changes to GitHub
      - name: Commit and Push
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          git add gitops/k8s/

          git diff --staged --quiet || git commit -m "Update Kubernetes image tags"

          git push
